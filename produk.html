<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepatu Sneaker Sport Red Edition - Shopee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
        body { font-family: 'Roboto', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-gradient-to-b from-orange-600 to-orange-500 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-6">
            <a href="index.html" class="flex items-center gap-2 text-2xl font-black tracking-tighter">
                <i data-lucide="shopping-bag" class="w-8 h-8"></i>
                <span>Shopee</span>
            </a>
            <form action="kategori.html" class="flex-grow max-w-2xl flex bg-white rounded-sm overflow-hidden p-1 shadow">
                <input type="text" placeholder="Cari di Shopee..." class="w-full px-3 py-1.5 text-sm text-gray-800 focus:outline-none">
                <button type="submit" class="bg-orange-500 text-white px-6 py-1.5 rounded-sm"><i data-lucide="search" class="w-4 h-4"></i></button>
            </form>
            <a href="keranjang.html" class="relative p-2"><i data-lucide="shopping-cart" class="w-7 h-7"></i></a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 w-full space-y-6 flex-grow">
        
        <!-- Main Product Card -->
        <div class="bg-white p-6 rounded-sm shadow-sm grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Left: Product Images -->
            <div class="space-y-4">
                <div class="w-full h-96 bg-gray-100 rounded-sm overflow-hidden border">
                    <img id="mainImage" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- Right: Product Info & Buy Controls -->
            <div class="space-y-6">
                <div>
                    <span class="bg-orange-500 text-white font-bold text-xs px-2 py-0.5 rounded-sm">Star+</span>
                    <h1 class="text-xl font-medium text-gray-900 mt-2">Sepatu Sneaker Sport Red Edition Running Unisex Casual Original Premium</h1>
                    
                    <div class="flex items-center gap-4 text-xs mt-3 text-gray-500 border-b pb-3">
                        <div class="flex items-center text-orange-500 font-bold gap-1">
                            <span>4.9</span>
                            <i data-lucide="star" class="w-3.5 h-3.5 fill-orange-500"></i>
                        </div>
                        <span>|</span>
                        <span><strong>2.4rb</strong> Penilaian</span>
                        <span>|</span>
                        <span><strong>10rb+</strong> Terjual</span>
                    </div>
                </div>

                <!-- Price Banner -->
                <div class="bg-gray-50 p-4 rounded-sm flex items-center gap-4">
                    <span class="text-gray-400 line-through text-sm">Rp 299.000</span>
                    <span class="text-orange-600 font-black text-3xl">Rp 149.000</span>
                    <span class="bg-orange-500 text-white text-xs font-bold px-1.5 py-0.5 rounded">50% DISKON</span>
                </div>

                <!-- Variations -->
                <div class="space-y-4 text-xs">
                    <div class="flex items-center gap-6">
                        <span class="w-20 text-gray-500">Ukuran</span>
                        <div class="flex gap-2">
                            <button class="border border-orange-500 text-orange-600 px-3 py-1 rounded-sm font-bold">39</button>
                            <button class="border border-gray-300 hover:border-orange-500 px-3 py-1 rounded-sm">40</button>
                            <button class="border border-gray-300 hover:border-orange-500 px-3 py-1 rounded-sm">41</button>
                            <button class="border border-gray-300 hover:border-orange-500 px-3 py-1 rounded-sm">42</button>
                        </div>
                    </div>

                    <div class="flex items-center gap-6">
                        <span class="w-20 text-gray-500">Jumlah</span>
                        <div class="flex items-center border rounded-sm">
                            <button class="px-3 py-1 border-r text-gray-600 hover:bg-gray-100">-</button>
                            <input type="text" value="1" class="w-12 text-center text-xs border-none focus:outline-none">
                            <button class="px-3 py-1 border-l text-gray-600 hover:bg-gray-100">+</button>
                        </div>
                        <span class="text-gray-400">Tersisa 450 buah</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-4 pt-4">
                    <a href="keranjang.html" class="flex-1 border border-orange-500 bg-orange-50 hover:bg-orange-100 text-orange-600 font-bold py-3 rounded-sm text-xs flex items-center justify-center gap-2">
                        <i data-lucide="shopping-cart" class="w-4 h-4"></i> Masukkan Keranjang
                    </a>
                    <a href="checkout.html" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-sm text-xs text-center">
                        Beli Sekarang
                    </a>
                </div>
            </div>

        </div>

    </main>

    <footer class="bg-gray-200 text-center py-4 text-xs text-gray-500 border-t mt-12">
        &copy; 2026 Shopee Clone. Hak Cipta Dilindungi Undang-Undang.
    </footer>
    <script>lucide.createIcons();</script>
</body>
</html>
