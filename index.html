<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemantau Web Siswa (RPL 1 & RPL 2)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex flex-col overflow-hidden">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-3">
            <i data-lucide="monitor" class="text-indigo-400 w-7 h-7"></i>
            <h1 class="text-xl font-bold tracking-wide">Pemantau Web Siswa</h1>
        </div>
        <div class="flex items-center gap-4 text-sm text-slate-400">
            <div>Total Web: <span id="total-count" class="font-semibold text-indigo-400">0</span></div>
            <button onclick="muatDataSiswa()" class="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs transition text-slate-200">
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> Refresh Data
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar: Form Input Siswa & Daftar Web -->
        <aside class="w-1/3 min-w-[340px] max-w-[420px] bg-slate-800/50 border-r border-slate-700 p-4 flex flex-col gap-4 overflow-y-auto">
            
            <!-- Form Input (Untuk Siswa) -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow flex flex-col gap-3">
                <h2 class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Form Setor Web Siswa</h2>
                <div>
                    <label class="text-xs text-slate-400">Nama Lengkap Siswa</label>
                    <input type="text" id="input-nama" placeholder="Contoh: Budi Santoso" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
                </div>
                <div>
                    <label class="text-xs text-slate-400">Pilih Kelas</label>
                    <select id="input-kelas" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
                        <option value="RPL 1">RPL 1</option>
                        <option value="RPL 2">RPL 2</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs text-slate-400">URL / Alamat Web Siswa</label>
                    <input type="url" id="input-url" placeholder="https://nama-siswa.vercel.app" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
                </div>
                <button onclick="kirimDataSiswa()" id="btn-kirim" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 font-medium py-2 rounded-lg text-sm transition flex items-center justify-center gap-2 disabled:opacity-50">
                    <i data-lucide="send" class="w-4 h-4"></i> Simpan ke Google Sheet
                </button>
            </div>

            <!-- List Web Siswa & Filter -->
            <div class="flex-1 flex flex-col gap-2">
                <div class="flex justify-between items-center mb-1">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Daftar Web Terkumpul</h2>
                    <!-- Filter Kelas -->
                    <select id="filter-kelas" onchange="filterDanTampilkanData()" class="bg-slate-800 text-indigo-400 border border-slate-700 rounded px-2 py-1 text-xs focus:outline-none">
                        <option value="SEMUA">Semua Kelas</option>
                        <option value="RPL 1">RPL 1</option>
                        <option value="RPL 2">RPL 2</option>
                    </select>
                </div>

                <div id="daftar-siswa" class="flex flex-col gap-2">
                    <div class="text-center text-xs text-slate-500 py-6">Memuat data dari Google Sheet...</div>
                </div>
            </div>
        </aside>

        <!-- Preview Web Area -->
        <main class="flex-1 bg-slate-950 flex flex-col">
            <!-- Top Bar Preview -->
            <div class="bg-slate-800 px-4 py-2 border-b border-slate-700 flex justify-between items-center text-xs">
                <div class="flex items-center gap-2 truncate text-slate-400">
                    <i data-lucide="globe" class="w-4 h-4 text-indigo-400 shrink-0"></i>
                    <span id="preview-url-text">Pilih atau Play web siswa untuk melihat tampilan</span>
                </div>
                <button onclick="refreshIframe()" title="Refresh Web" class="p-1.5 hover:bg-slate-700 rounded-md transition text-slate-300">
                    <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Frame Konten Web -->
            <div class="flex-1 relative bg-white">
                <div id="placeholder-text" class="absolute inset-0 bg-slate-950 flex flex-col items-center justify-center text-slate-500 gap-3 z-10">
                    <i data-lucide="play-circle" class="w-16 h-16 stroke-1"></i>
                    <p class="text-sm">Klik tombol <span class="text-indigo-400 font-semibold">Play (▶)</span> pada nama siswa di menu sebelah kiri</p>
                </div>
                <iframe id="web-preview" src="" class="w-full h-full border-0 relative z-0" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
            </div>
        </main>
    </div>

    <!-- Logic JavaScript -->
    <script>
        // PASTE URL GOOGLE APPS SCRIPT LATEST DEPLOYMENT ANDA DI SINI
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxxs_NxuTnqTMxTN5ol8l2s3nOt1Y0OXY_x8wQKWkC3LAycp4vs81Al1E_F1Su0Wesl6g/exec";

        let rawDataSiswa = []; // Menyimpan data mentah dari server

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            muatDataSiswa();
        });

        // 1. Simpan Data Siswa
        function kirimDataSiswa() {
            const namaInput = document.getElementById('input-nama');
            const kelasInput = document.getElementById('input-kelas');
            const urlInput = document.getElementById('input-url');
            const btnKirim = document.getElementById('btn-kirim');
            
            const nama = namaInput.value.trim();
            const kelas = kelasInput.value;
            let url = urlInput.value.trim();

            if (!nama || !url) {
                alert("Harap isi Nama Lengkap dan Alamat Web!");
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            btnKirim.disabled = true;
            btnKirim.innerText = "Mengirim...";

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "simpan", nama: nama, kelas: kelas, url: url })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "success") {
                    alert("Berhasil! Data web tersimpan.");
                    namaInput.value = '';
                    urlInput.value = '';
                    muatDataSiswa();
                } else {
                    alert("Gagal: " + data.message);
                }
            })
            .catch(error => {
                alert("Error saat menyimpan data: " + error);
            })
            .finally(() => {
                btnKirim.disabled = false;
                btnKirim.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Simpan ke Google Sheet`;
                lucide.createIcons();
            });
        }

        // 2. Baca Data Siswa dari Sheet
        function muatDataSiswa() {
            const container = document.getElementById('daftar-siswa');
            container.innerHTML = `<div class="text-center text-xs text-slate-500 py-6">Memuat data...</div>`;

            fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                rawDataSiswa = data;
                filterDanTampilkanData();
            })
            .catch(err => {
                container.innerHTML = `<div class="text-center text-xs text-rose-400 py-6">Gagal memuat data dari Google Sheet</div>`;
            });
        }

        // 3. Filter berdasarkan Kelas dan Render UI
        function filterDanTampilkanData() {
            const container = document.getElementById('daftar-siswa');
            const totalCount = document.getElementById('total-count');
            const filterKelas = document.getElementById('filter-kelas').value;

            let dataFiltered = rawDataSiswa;
            if (filterKelas !== "SEMUA") {
                dataFiltered = rawDataSiswa.filter(item => item.kelas === filterKelas);
            }

            container.innerHTML = '';
            totalCount.innerText = dataFiltered.length;

            if (dataFiltered.length === 0) {
                container.innerHTML = `<div class="text-center text-xs text-slate-500 py-6">Tidak ada data untuk kelas ini</div>`;
                return;
            }

            dataFiltered.slice().reverse().forEach((siswa) => {
                const card = document.createElement('div');
                card.className = "bg-slate-800 p-3 rounded-lg border border-slate-700 flex justify-between items-center hover:border-slate-600 transition gap-2";
                card.innerHTML = `
                    <div class="overflow-hidden pr-1 flex-1">
                        <div class="flex items-center gap-2">
                            <h3 class="font-medium text-sm text-slate-200 truncate">${siswa.nama}</h3>
                            <span class="text-[10px] bg-indigo-900/80 text-indigo-300 font-semibold px-1.5 py-0.5 rounded border border-indigo-700/50">${siswa.kelas}</span>
                        </div>
                        <a href="${siswa.url}" target="_blank" class="text-xs text-indigo-400 hover:underline truncate block mt-0.5">${siswa.url}</a>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="playWeb('${siswa.url}')" title="Play / Preview" class="p-2 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600 hover:text-white rounded-md transition">
                            <i data-lucide="play" class="w-4 h-4 fill-current"></i>
                        </button>
                        <button onclick="hapusSiswa(${siswa.id})" title="Hapus Data (Khusus Guru)" class="p-2 bg-rose-600/20 text-rose-400 hover:bg-rose-600 hover:text-white rounded-md transition">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        // 4. Hapus Data dengan Proteksi PIN Admin
        function hapusSiswa(rowId) {
            const pin = prompt("Masukkan PIN Admin/Guru untuk menghapus data ini:");
            if (!pin) return;

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "hapus", rowId: rowId, pin: pin })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    alert("Data berhasil dihapus!");
                    muatDataSiswa();
                } else {
                    alert("Gagal: " + data.message);
                }
            })
            .catch(error => {
                alert("Terjadi kesalahan: " + error);
            });
        }

        // Helper Preview UI
        function playWeb(url) {
            const iframe = document.getElementById('web-preview');
            const placeholder = document.getElementById('placeholder-text');
            const previewUrlText = document.getElementById('preview-url-text');

            placeholder.style.display = 'none';
            iframe.src = url;
            previewUrlText.innerText = url;
        }

        function refreshIframe() {
            const iframe = document.getElementById('web-preview');
            if (iframe.src) iframe.src = iframe.src;
        }
    </script>
</body>
</html>
